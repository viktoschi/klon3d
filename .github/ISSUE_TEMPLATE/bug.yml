name: Bug
description: Something behaves differently than expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Attach only what may be shared: no third-party patterns, no body measurements of other people, no CLO files.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Command with all arguments, and the pattern or project it needs.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: Output, measured value, image. Does it happen again after a restart?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit (git rev-parse --short HEAD) and operating system.
    validations:
      required: true
