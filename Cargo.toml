[workspace]
resolver = "2"
members = [
    "crates/klon3d-pattern",
    "crates/klon3d-cli",
    "crates/klon3d-view",
    "crates/klon3d-koerper",
    "crates/klon3d-mesh",
    "crates/klon3d-sim"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viktoschi/klon3d"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
quick-xml = "0.42"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1